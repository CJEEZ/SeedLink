services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env.local
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true

  app-prod:
    profiles:
      - production
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_DATABASE_URL: ${VITE_FIREBASE_DATABASE_URL:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports:
      - "8080:80"
    init: true

  firebase-emulators:
    profiles:
      - emulators
    image: seedlink-firebase-emulators:latest
    build:
      context: .
      dockerfile: Dockerfile.firebase
    working_dir: /workspace
    command:
      - firebase
      - emulators:start
      - --only
      - dataconnect
      - --project
      - demo-seedlink
      - --config
      - /workspace/firebase.json
    ports:
      - "9399:9399"
    volumes:
      - .:/workspace
      - firebase_emulator_cache:/root/.cache/firebase
    init: true

volumes:
  node_modules:
  firebase_emulator_cache: