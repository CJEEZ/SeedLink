name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Lint
        run: npm run lint -- src --ignore-pattern "**/dataconnect-generated/**"

      - name: Build app
        run: npm run build

      - name: Test Cloud Functions
        run: npm test --prefix functions

      - name: Check Cloud Functions syntax
        run: node --check functions/index.js

      - name: Build production Docker image
        run: docker build --file Dockerfile --target production --tag seedlink-app:ci .
